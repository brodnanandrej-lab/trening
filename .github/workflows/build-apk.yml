name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nastavenie Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Nastavenie Android SDK
        uses: android-actions/setup-android@v3

      - name: Inštalácia Capacitor nástrojov
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializácia Android projektu
        run: |
          npx cap init "Môj Tréning" "sk.trening.app" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Zostavenie APK balíčka
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Uloženie APK ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Trening-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
