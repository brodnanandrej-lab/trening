name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nastavenie Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inštalácia Capacitor nástrojov
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Inicializácia Android projektu
        run: |
          npx cap init "Môj Tréning" "sk.trening.app" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Generovanie trvalého Keystore súboru
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'DefaultPass123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'DefaultPass123' }}
          ALIAS: ${{ secrets.KEY_ALIAS || 'treningkey' }}
        run: |
          keytool -genkey -v -keystore release.keystore -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass $STORE_PASS -keypass $KEY_PASS -dname "CN=TreningApp, OU=Dev, O=App, L=City, S=State, C=SK"

      - name: Zostavenie Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Podpísanie APK pomocou Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'DefaultPass123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'DefaultPass123' }}
          ALIAS: ${{ secrets.KEY_ALIAS || 'treningkey' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass $STORE_PASS -keypass $KEY_PASS $APK_PATH $ALIAS

      - name: Uloženie podpísanej APK
        uses: actions/upload-artifact@v4
        with:
          name: Trening-App-Podpisana-APK
          path: android/app/build/outputs/apk/release/
